server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 210m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets/, so it can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Laravel: the API, the Sanctum CSRF cookie, social login and the health check.
    location ~ ^/(api|sanctum|oauth|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # The composer streams AI output as server-sent events; don't hold it back.
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # Everything else is the React app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
