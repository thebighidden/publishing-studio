; Source lives on a bind mount from Windows, where every file stat is slow.
; Cache compiled scripts, but still pick up edits immediately.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
realpath_cache_size=4096K
realpath_cache_ttl=600

memory_limit=512M
upload_max_filesize=20M
post_max_size=24M
